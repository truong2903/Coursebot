<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đổi mật khẩu · EduPortal</title><link rel="stylesheet" href="/assets/css/auth.css?v=20261109b"><link rel="stylesheet" href="/assets/css/theme.css?v=20261125a"><script src="/assets/js/core/theme.js?v=20261125a"></script><script type="module" src="/assets/js/features/auth/change-password.js"></script></head>
<body><button class="theme-toggle-btn theme-toggle-floating" type="button" data-theme-toggle aria-label="Chuyển giao diện sáng/tối" title="Chuyển giao diện sáng/tối"><span class="theme-icon" aria-hidden="true"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></span><span class="theme-label">Tối</span></button><main class="auth-card"><a class="brand" href="/"><span class="brand-mark">E</span><span><strong>EduPortal</strong><small>BẢO MẬT TÀI KHOẢN</small></span></a><h1>Đổi mật khẩu</h1><p class="lead">Chọn mật khẩu mới có ít nhất 10 ký tự và không trùng mật khẩu hiện tại.</p><form id="changeForm" novalidate><div class="field"><label for="currentPassword">Mật khẩu hiện tại</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required></div><div class="field"><label for="newPassword">Mật khẩu mới</label><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="10" required></div><div class="field"><label for="confirmPassword">Nhập lại mật khẩu mới</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required></div><button class="auth-button" type="submit">Cập nhật mật khẩu</button><p id="authMessage" class="auth-message" role="alert" aria-live="polite"></p></form><p class="auth-links"><a href="/">Quay về cổng sinh viên</a></p></main></body></html>
