<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đặt mật khẩu mới · EduPortal</title><link rel="stylesheet" href="/assets/css/auth.css"><script type="module" src="/assets/js/features/auth/reset-password.js"></script></head>
<body><main class="auth-card"><a class="brand" href="/login.html"><span class="brand-mark">E</span><span><strong>EduPortal</strong><small>KHÔI PHỤC TÀI KHOẢN</small></span></a><h1>Đặt mật khẩu mới</h1><p class="lead">Nhập email đã đăng ký, mã OTP nhận được và mật khẩu mới gồm ít nhất 10 ký tự.</p><form id="resetForm" novalidate><div class="field"><label for="email">Email tài khoản</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="token">Mã OTP</label><input id="token" name="token" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div><div class="field"><label for="password">Mật khẩu mới</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required></div><div class="field"><label for="confirmPassword">Nhập lại mật khẩu</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required></div><button class="auth-button" type="submit">Lưu mật khẩu mới</button><p id="authMessage" class="auth-message" role="alert" aria-live="polite"></p></form><p class="auth-links"><a href="/forgot-password.html">Gửi mã OTP mới</a> · <a href="/login.html">Quay lại đăng nhập</a></p></main></body></html>
