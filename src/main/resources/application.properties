spring.application.name=coursebot
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coursebot}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
app.datasource.auto-create-db=${APP_AUTO_CREATE_DB:true}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=128
spring.jpa.properties.hibernate.jdbc.batch_size=100
app.timetable.source-url=${TIMETABLE_SOURCE_URL:}
app.timetable.registration-always-open=${TIMETABLE_REGISTRATION_ALWAYS_OPEN:false}
app.academic.source-url=${ACADEMIC_SOURCE_URL:}
app.academic.initial-password=${ACADEMIC_INITIAL_PASSWORD:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
app.mail.from=${SMTP_FROM:noreply@localhost}
app.bootstrap.admin-username=${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
app.preview.accounts-enabled=${APP_PREVIEW_ACCOUNTS_ENABLED:false}
app.ai.provider=${AI_PROVIDER:OPENAI_COMPATIBLE}
app.ai.api-url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gpt-4o-mini}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:12}

app.enrollment.max-credits=20
app.enrollment.drop-window-days=${APP_DROP_WINDOW_DAYS:7}
