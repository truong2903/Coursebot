<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đổi mật khẩu · EduPortal</title><link rel="stylesheet" href="/assets/css/auth.css"><script type="module" src="/assets/js/features/auth/change-password.js"></script></head>
<body><main class="auth-card"><a class="brand" href="/"><span class="brand-mark">E</span><span><strong>EduPortal</strong><small>BẢO MẬT TÀI KHOẢN</small></span></a><h1>Đổi mật khẩu</h1><p class="lead">Chọn mật khẩu mới có ít nhất 10 ký tự và không trùng mật khẩu hiện tại.</p><form id="changeForm" novalidate><div class="field"><label for="currentPassword">Mật khẩu hiện tại</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required></div><div class="field"><label for="newPassword">Mật khẩu mới</label><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="10" required></div><div class="field"><label for="confirmPassword">Nhập lại mật khẩu mới</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required></div><button class="auth-button" type="submit">Cập nhật mật khẩu</button><p id="authMessage" class="auth-message" role="alert" aria-live="polite"></p></form><p class="auth-links"><a href="/">Quay về cổng sinh viên</a></p></main></body></html>
