<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Không gian làm việc · EduPortal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/workspace.css?v=20261109c">
  <link rel="stylesheet" href="/assets/css/workspace-extra.css?v=20261109c">
  <script type="module" src="/assets/js/features/workspace/workspace.js?v=20261109c"></script>
</head>
<body>
  <div class="workspace-shell">
    <aside class="workspace-sidebar">
      <a class="workspace-brand" href="/"><span class="brand-mark">🎓</span><span><b>EduPortal</b><small>HỆ THỐNG HỌC VỤ</small></span></a>
      <nav id="workspaceNav" class="workspace-nav" aria-label="Điều hướng workspace"></nav>
      <div class="sidebar-bottom">
        <button class="profile-row" id="sidebarProfileButton" type="button" aria-label="Tùy chọn tài khoản" title="Bấm để xem tùy chọn tài khoản">
          <span class="avatar" id="identityAvatar">—</span>
          <span class="profile-copy">
            <strong id="identityName">Đang tải tài khoản…</strong>
            <small id="identityRole">—</small>
          </span>
        </button>
      </div>
    </aside>
    <main class="workspace-main">
      <header class="workspace-topbar">
        <div>
          <span class="crumb">EduPortal</span>
          <span class="crumb-separator">/</span>
          <strong id="pageBreadcrumb">Tổng quan</strong>
        </div>
        <div class="workspace-top-actions" id="workspaceTopActions">
          <div class="workspace-semester" id="semesterLabel">—</div>
          <div class="account-menu" id="accountMenu">
            <button class="top-user account-menu-toggle" id="accountMenuToggle" type="button" aria-label="Tùy chọn tài khoản" aria-expanded="false" aria-controls="accountMenuPanel">
              <span class="avatar small" id="topAvatar">—</span>
              <span>
                <strong id="topName">Đang tải…</strong>
                <small id="topRole">Giảng viên</small>
              </span>
              <span class="account-menu-chevron" aria-hidden="true">▾</span>
            </button>
            <nav class="account-menu-panel" id="accountMenuPanel" aria-label="Tùy chọn tài khoản" hidden>
              <a href="/change-password.html">
                <span class="ws-nav-icon" aria-hidden="true">
                  <svg class="ws-anim-svg ws-icon-pass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path class="pass-shackle" d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </span>
                <span>Đổi mật khẩu</span>
              </a>
            </nav>
          </div>
          <button id="logoutButton" class="top-logout-button" type="button">Đăng xuất</button>
        </div>
      </header>
      <section class="workspace-content">
        <div class="page-title-row"><div><p class="page-eyebrow" id="pageEyebrow">KHÔNG GIAN LÀM VIỆC</p><h1 id="pageTitle">Tổng quan</h1><p id="pageDescription" class="page-description"></p></div><div id="pageActions"></div></div>
        <div id="workspaceView" aria-live="polite"><div class="workspace-loading">Đang tải dữ liệu…</div></div>
      </section>
    </main>
  </div>
  <dialog id="workspaceDialog" class="workspace-dialog"><form method="dialog" id="workspaceForm"><div class="workspace-dialog-head"><div><small id="dialogEyebrow">THÔNG TIN</small><h2 id="dialogTitle">Chi tiết</h2></div><button class="dialog-close" value="cancel" aria-label="Đóng">×</button></div><div id="dialogFields" class="dialog-fields"></div><div id="dialogMessage" class="dialog-message" role="alert"></div><div class="dialog-actions"><button class="secondary-button" value="cancel">Đóng</button><button class="primary-button" id="dialogSave" type="button">Lưu thay đổi</button></div></form></dialog>
  <dialog id="curriculumCoursesDialog" class="workspace-dialog"><div class="workspace-dialog-head"><div><small>KHUNG CHƯƠNG TRÌNH</small><h2 id="curriculumCoursesTitle">Các môn học</h2></div><button id="closeCurriculumCourses" class="dialog-close" type="button" aria-label="Đóng">×</button></div><div id="curriculumCoursesBody"></div><form id="curriculumCourseForm" class="curriculum-entry-form"><input name="courseCode" placeholder="Mã môn học" required><input name="suggestedSemester" placeholder="Học kỳ đề xuất" maxlength="40" required><label><input name="requiredCourse" type="checkbox" checked> Bắt buộc</label><input name="orderIndex" type="number" min="0" value="0" aria-label="Thứ tự"><button class="primary-button" type="submit">Thêm môn</button></form></dialog>
  <div id="workspaceToast" class="workspace-toast" role="status" aria-live="polite"></div>
</body>
</html>
