<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập · EduPortal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/auth.css">
  <script type="module" src="/assets/js/features/auth/login.js"></script>
</head>
<body>
  <main class="auth-card">
    <a class="brand" href="/"><span class="brand-mark">E</span><span><strong>EduPortal</strong><small>CỔNG ĐĂNG KÝ HỌC PHẦN</small></span></a>
    <h1>Đăng nhập</h1>
    <p class="lead">Đăng nhập bằng tài khoản được nhà trường cấp để tiếp tục.</p>
    <form id="loginForm" novalidate>
      <div class="field"><label for="username">Tên đăng nhập</label><input id="username" name="username" autocomplete="username" required autofocus></div>
      <div class="field"><label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <div class="password-visibility"><label for="showPassword"><input id="showPassword" type="checkbox" aria-controls="password">Hiện mật khẩu</label></div>
      <div class="auth-options"><a href="/forgot-password.html">Quên mật khẩu?</a></div>
      <button class="auth-button" type="submit">Đăng nhập</button>
      <p id="authMessage" class="auth-message" role="alert" aria-live="polite"></p>
    </form>
    <p class="auth-links">Cần hỗ trợ? Liên hệ Phòng Đào tạo hoặc quản trị hệ thống.</p>
  </main>
</body>
</html>
