<body><button class="theme-toggle-btn theme-toggle-floating" type="button" data-theme-toggle aria-label="Chuyển giao diện sáng/tối" title="Chuyển giao diện sáng/tối"><span class="theme-icon" aria-hidden="true"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></span><span class="theme-label">Tối</span></button><main class="auth-card"><a class="brand" href="/login.html"><span class="brand-mark">E</span><span><strong>EduPortal</strong><small>KHÔI PHỤC TÀI KHOẢN</small></span></a><h1>Đặt mật khẩu mới</h1><p class="lead">Nhập email đã đăng ký, mã OTP nhận được và mật khẩu mới gồm ít nhất 10 ký tự.</p><form id="resetForm" novalidate><div class="field"><label for="email">Email tài khoản</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="token">Mã OTP</label><input id="token" name="token" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div><div class="field"><label for="password">Mật khẩu mới</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required></div><div class="field"><label for="confirmPassword">Nhập lại mật khẩu</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required></div><button class="auth-button" type="submit">Lưu mật khẩu mới</button><p id="authMessage" class="auth-message" role="alert" aria-live="polite"></p></form><p class="auth-links"><a href="/forgot-password.html">Gửi mã OTP mới</a> · <a href="/login.html">Quay lại đăng nhập</a></p></main></body></html>
